<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Painel de Finanças Pessoais</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Configurações PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">💰 Minhas Finanças</h1>
            <div id="user-info" class="hidden flex items-center gap-4">
                <span id="user-email" class="text-sm text-indigo-100"></span>
                <button type="button" onclick="logout()" class="bg-indigo-700 hover:bg-indigo-800 text-xs px-3 py-1.5 rounded transition">Sair</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full">

        <!-- Tela de Autenticação (Login / Cadastro) -->
        <div id="auth-section" class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-sm border border-slate-100">
            <h2 id="auth-title" class="text-2xl font-bold mb-6 text-center text-indigo-600">Acessar Sistema</h2>
            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">E-mail</label>
                    <input type="email" id="email" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Senha</label>
                    <input type="password" id="password" required minlength="6" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <button type="submit" id="auth-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition">Entrar</button>
            </form>
            <p class="text-center text-sm mt-4 text-slate-500">
                <span id="toggle-text">Não tem uma conta?</span> 
                <button type="button" onclick="toggleAuthMode()" id="toggle-btn" class="text-indigo-600 font-medium hover:underline ml-1">Criar conta</button>
            </p>
        </div>

        <!-- Dashboard Financeiro (Aparece após login) -->
        <div id="dashboard-section" class="hidden space-y-6">
            
            <!-- Cards de Resumo -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                    <p class="text-sm text-slate-500">Saldo Atual</p>
                    <p id="total-balance" class="text-2xl font-bold text-slate-800">R$ 0,00</p>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                    <p class="text-sm text-emerald-600 font-medium">Receitas do Mês</p>
                    <p id="total-income" class="text-2xl font-bold text-emerald-600">R$ 0,00</p>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                    <p class="text-sm text-rose-600 font-medium">Despesas do Mês</p>
                    <p id="total-expense" class="text-2xl font-bold text-rose-600">R$ 0,00</p>
                </div>
            </div>

            <!-- Adicionar Transação -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                <h3 class="text-lg font-bold mb-4">Nova Transação</h3>
                <form id="transaction-form" onsubmit="addTransaction(event)" class="grid grid-cols-1 md:grid-cols-5 gap-3">
                    <input type="text" id="desc" placeholder="Descrição (ex: Supermercado)" required class="md:col-span-2 px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                    <input type="number" step="0.01" id="amount" placeholder="Valor (R$)" required class="px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                    <select id="type" class="px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="expense">Despesa</option>
                        <option value="income">Receita</option>
                    </select>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition">Adicionar</button>
                </form>
            </div>

            <!-- Histórico de Transações -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                <div class="p-4 border-b border-slate-100">
                    <h3 class="text-lg font-bold">Histórico de Lançamentos</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider">
                                <th class="p-3">Data</th>
                                <th class="p-3">Descrição</th>
                                <th class="p-3">Tipo</th>
                                <th class="p-3 text-right">Valor</th>
                                <th class="p-3 text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="transactions-list" class="divide-y divide-slate-100 text-sm">
                            <!-- Preenchido via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </main>

    <!-- Script de Conexão e Lógica -->
    <script>
        const SUPABASE_URL = 'https://gnuggwjbkirmelgvvcdl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_h_BW8GNSu7DuN6GNp1gRUw_TMCTCL5F';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isSignUp = false;
        let currentUser = null;

        // Inicialização
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                showDashboard();
            }

            supabaseClient.auth.onAuthStateChange((_event, session) => {
                if (session) {
                    currentUser = session.user;
                    showDashboard();
                } else {
                    currentUser = null;
                    showAuth();
                }
            });
        });

        // Alternar entre Login e Cadastro
        function toggleAuthMode() {
            isSignUp = !isSignUp;
            document.getElementById('auth-title').innerText = isSignUp ? 'Criar Conta' : 'Acessar Sistema';
            document.getElementById('auth-btn').innerText = isSignUp ? 'Cadastrar' : 'Entrar';
            document.getElementById('toggle-text').innerText = isSignUp ? 'Já tem uma conta?' : 'Não tem uma conta?';
            document.getElementById('toggle-btn').innerText = isSignUp ? 'Fazer login' : 'Criar conta';
        }

        // Lidar com Autenticação
        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (isSignUp) {
                const { error } = await supabaseClient.auth.signUp({ email, password });
                if (error) {
                    alert('Erro ao cadastrar: ' + error.message);
                } else {
                    alert('Cadastro realizado! Agora clique em "Fazer login" e entre com seu e-mail e senha.');
                    toggleAuthMode();
                }
            } else {
                const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) alert('Erro ao entrar: ' + error.message);
            }
        }

        async function logout() {
            await supabaseClient.auth.signOut();
        }

        function showDashboard() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('user-info').classList.remove('hidden');
            document.getElementById('user-email').innerText = currentUser.email;
            loadTransactions();
        }

        function showAuth() {
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('user-info').classList.add('hidden');
        }

        // Carregar Transações do Supabase
        async function loadTransactions() {
            const { data, error } = await supabaseClient
                .from('transactions')
                .select('*')
                .order('date', { ascending: false });

            if (error) {
                console.error('Erro ao carregar transações:', error);
                return;
            }

            renderTransactions(data);
            calculateSummary(data);
        }

        // Renderizar Tabela
        function renderTransactions(transactions) {
            const tbody = document.getElementById('transactions-list');
            tbody.innerHTML = '';

            if (transactions.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">Nenhum lançamento encontrado.</td></tr>`;
                return;
            }

            transactions.forEach(t => {
                const formattedValue = Number(t.amount).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                const typeLabel = t.type === 'income' ? '<span class="text-emerald-600 font-medium">Receita</span>' : '<span class="text-rose-600 font-medium">Despesa</span>';
                
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-3 text-slate-500">${t.date}</td>
                        <td class="p-3 font-medium">${t.description}</td>
                        <td class="p-3">${typeLabel}</td>
                        <td class="p-3 text-right font-semibold ${t.type === 'income' ? 'text-emerald-600' : 'text-slate-800'}">${formattedValue}</td>
                        <td class="p-3 text-center">
                            <button type="button" onclick="deleteTransaction('${t.id}')" class="text-slate-400 hover:text-rose-600 transition text-xs font-bold">Excluir</button>
                        </td>
                    </tr>
                `;
            });
        }

        // Calcular Resumos
        function calculateSummary(transactions) {
            let income = 0;
            let expense = 0;

            transactions.forEach(t => {
                const val = Number(t.amount);
                if (t.type === 'income') income += val;
                else expense += val;
            });

            const balance = income - expense;

            document.getElementById('total-balance').innerText = balance.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
            document.getElementById('total-income').innerText = income.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
            document.getElementById('total-expense').innerText = expense.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
        }

        // Adicionar Transação
        async function addTransaction(e) {
            e.preventDefault();
            const description = document.getElementById('desc').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const type = document.getElementById('type').value;

            const { error } = await supabaseClient.from('transactions').insert([
                { description, amount, type, category: 'Geral', user_id: currentUser.id }
            ]);

            if (error) {
                alert('Erro ao salvar: ' + error.message);
            } else {
                document.getElementById('transaction-form').reset();
                loadTransactions();
            }
        }

        // Excluir Transação
        async function deleteTransaction(id) {
            if (!confirm('Deseja realmente excluir este lançamento?')) return;

            const { error } = await supabaseClient.from('transactions').delete().eq('id', id);
            if (error) alert('Erro ao excluir: ' + error.message);
            else loadTransactions();
        }

        // Registrar Service Worker para PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(() => console.log('PWA registrado com sucesso!'))
                    .catch(err => console.log('Erro ao registrar PWA:', err));
            });
        }
    </script>
</body>
</html>
