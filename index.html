<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Painel de Finanças Pessoais</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Configurações PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">💰 Minhas Finanças</h1>
            <div id="user-info" class="hidden flex items-center gap-4">
                <span id="user-email" class="text-sm text-indigo-100"></span>
                <button type="button" onclick="logout()" class="bg-indigo-700 hover:bg-indigo-800 text-xs px-3 py-1.5 rounded transition">Sair</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full">

        <!-- Tela de Autenticação (Login / Cadastro) -->
        <div id="auth-section" class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-sm border border-slate-100">
            <h2 id="auth-title" class="text-2xl font-bold mb-6 text-center text-indigo-600">Acessar Sistema</h2>
            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">E-mail</label>
                    <input type="email" id="email" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Senha</label>
                    <input type="password" id="password" required minlength="6" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <button type="submit" id="auth-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition">Entrar</button>
            </form>
            <p class="text-center text-sm mt-4 text-slate-500">
                <span id="toggle-text">Não tem uma conta?</span> 
                <button type="button" onclick="toggleAuthMode()" id="toggle-btn" class="text-indigo-600 font-medium hover:underline ml-1">Criar conta</button>
            </p>
        </div>

        <!-- Dashboard Financeiro (Aparece após login) -->
        <div id="dashboard-section" class="hidden space-y-6">
            
            <!-- Barra de Filtro de Mês e Resumo -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex flex-col md:flex-row justify-between items-center gap-4">
                <div>
                    <h2 class="text-lg font-bold text-slate-800">Visão Mensal</h2>
                    <p class="text-xs text-slate-500">Selecione o mês para visualizar o balanço</p>
                </div>
                <div>
                    <input type="month" id="filter-month" onchange="loadTransactions()" class="px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 font-medium bg-slate-50">
                </div>
            </div>

            <!-- Cards de Resumo -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                    <p class="text-sm text-slate-500">Saldo do Mês</p>
                    <p id="total-balance" class="text-2xl font-bold text-slate-800">R$ 0,00</p>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                    <p class="text-sm text-emerald-600 font-medium">Receitas do Mês</p>
                    <p id="total-income" class="text-2xl font-bold text-emerald-600">R$ 0,00</p>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                    <p class="text-sm text-rose-600 font-medium">Despesas do Mês</p>
                    <p id="total-expense" class="text-2xl font-bold text-rose-600">R$ 0,00</p>
                </div>
            </div>

            <!-- Adicionar Transação -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                <h3 class="text-lg font-bold mb-4">Nova Transação</h3>
                <form id="transaction-form" onsubmit="addTransaction(event)" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                        <input type="text" id="desc" placeholder="Descrição principal" required class="md:col-span-2 px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                        <input type="number" step="0.01" id="amount" placeholder="Valor (R$)" required class="px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                        <select id="type" onchange="updateFormFields()" class="px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="expense">Despesa</option>
                            <option value="income">Receita</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">Categoria</label>
                            <select id="category" onchange="checkOtherCategory()" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                                <!-- Preenchido via JS -->
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">Data da Despesa/Transação</label>
                            <input type="date" id="txn-date" required class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div id="recurrence-container" class="hidden">
                            <label class="block text-xs font-medium text-slate-500 mb-1">Tipo de Receita</label>
                            <select id="recurrence" onchange="toggleTargetMonth()" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                                <option value="recorrente">Recorrente (Todos os meses)</option>
                                <option value="eventual">Eventual (Mês específico)</option>
                            </select>
                        </div>
                        <div id="target-month-container" class="hidden">
                            <label class="block text-xs font-medium text-slate-500 mb-1">Mês de Recebimento</label>
                            <input type="month" id="target-month" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                    </div>

                    <!-- Campo obrigatório extra caso escolha "Outros" -->
                    <div id="other-details-container" class="hidden">
                        <label class="block text-xs font-medium text-amber-600 mb-1 font-semibold">Descreva o motivo / detalhe (Obrigatório para Outros)</label>
                        <input type="text" id="other-details" placeholder="Ex: Venda de item usado, reembolso, etc." class="w-full px-3 py-2 border border-amber-300 rounded-lg outline-none focus:ring-2 focus:ring-amber-500 bg-amber-50/30">
                    </div>

                    <div class="flex justify-end">
                        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2 rounded-lg transition">Adicionar Lançamento</button>
                    </div>
                </form>
            </div>

            <!-- Histórico de Transações -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                <div class="p-4 border-b border-slate-100 flex justify-between items-center">
                    <h3 class="text-lg font-bold">Histórico de Lançamentos</h3>
                    <span id="filter-status" class="text-xs text-slate-500">Exibindo mês selecionado</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider">
                                <th class="p-3">Data</th>
                                <th class="p-3">Descrição</th>
                                <th class="p-3">Categoria</th>
                                <th class="p-3">Tipo</th>
                                <th class="p-3 text-right">Valor</th>
                                <th class="p-3 text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="transactions-list" class="divide-y divide-slate-100 text-sm">
                            <!-- Preenchido via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </main>

    <!-- Script de Conexão e Lógica -->
    <script>
        const SUPABASE_URL = 'https://gnuggwjbkirmelgvvcdl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_h_BW8GNSu7DuN6GNp1gRUw_TMCTCL5F';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isSignUp = false;
        let currentUser = null;

        const expenseCategories = ['Alimentação', 'Moradia', 'Transporte', 'Lazer', 'Outros'];
        const incomeCategories = ['Salário', '13º Salário', 'Férias', 'Apartamento Del Castilho', 'Outros'];

        document.addEventListener('DOMContentLoaded', async () => {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const todayStr = now.toISOString().split('T')[0];

            document.getElementById('filter-month').value = `${year}-${month}`;
            document.getElementById('target-month').value = `${year}-${month}`;
            document.getElementById('txn-date').value = todayStr; // Preenche data atual por padrão

            updateFormFields();

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                showDashboard();
            }

            supabaseClient.auth.onAuthStateChange((_event, session) => {
                if (session) {
                    currentUser = session.user;
                    showDashboard();
                } else {
                    currentUser = null;
                    showAuth();
                }
            });
        });

        function updateFormFields() {
            const type = document.getElementById('type').value;
            const categorySelect = document.getElementById('category');
            const recurrenceContainer = document.getElementById('recurrence-container');
            
            categorySelect.innerHTML = '';
            const categories = type === 'income' ? incomeCategories : expenseCategories;
            categories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                categorySelect.appendChild(option);
            });

            if (type === 'income') {
                recurrenceContainer.classList.remove('hidden');
                toggleTargetMonth();
            } else {
                recurrenceContainer.classList.add('hidden');
                document.getElementById('target-month-container').classList.add('hidden');
            }

            checkOtherCategory();
        }

        function checkOtherCategory() {
            const category = document.getElementById('category').value;
            const otherContainer = document.getElementById('other-details-container');
            const otherInput = document.getElementById('other-details');

            if (category === 'Outros') {
                otherContainer.classList.remove('hidden');
                otherInput.required = true;
            } else {
                otherContainer.classList.add('hidden');
                otherInput.required = false;
                otherInput.value = '';
            }
        }

        function toggleTargetMonth() {
            const type = document.getElementById('type').value;
            const recurrence = document.getElementById('recurrence').value;
            const targetMonthContainer = document.getElementById('target-month-container');

            if (type === 'income' && recurrence === 'eventual') {
                targetMonthContainer.classList.remove('hidden');
            } else {
                targetMonthContainer.classList.add('hidden');
            }
        }

        function toggleAuthMode() {
            isSignUp = !isSignUp;
            document.getElementById('auth-title').innerText = isSignUp ? 'Criar Conta' : 'Acessar Sistema';
            document.getElementById('auth-btn').innerText = isSignUp ? 'Cadastrar' : 'Entrar';
            document.getElementById('toggle-text').innerText = isSignUp ? 'Já tem uma conta?' : 'Não tem uma conta?';
            document.getElementById('toggle-btn').innerText = isSignUp ? 'Fazer login' : 'Criar conta';
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (isSignUp) {
                const { error } = await supabaseClient.auth.signUp({ email, password });
                if (error) {
                    alert('Erro ao cadastrar: ' + error.message);
                } else {
                    alert('Cadastro realizado! Agora clique em "Fazer login" e entre com seu e-mail e senha.');
                    toggleAuthMode();
                }
            } else {
                const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) alert('Erro ao entrar: ' + error.message);
            }
        }

        async function logout() {
            await supabaseClient.auth.signOut();
        }

        function showDashboard() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('user-info').classList.remove('hidden');
            document.getElementById('user-email').innerText = currentUser.email;
            loadTransactions();
        }

        function showAuth() {
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('user-info').classList.add('hidden');
        }

        async function loadTransactions() {
            const selectedMonth = document.getElementById('filter-month').value;

            const { data, error } = await supabaseClient
                .from('transactions')
                .select('*')
                .order('date', { ascending: false });

            if (error) {
                console.error('Erro ao carregar transações:', error);
                return;
            }

            const filteredTransactions = data.filter(t => {
                if (t.type === 'expense') {
                    return t.date && t.date.startsWith(selectedMonth);
                } else {
                    if (t.recurrence === 'recorrente') {
                        return true;
                    } else {
                        return t.target_month === selectedMonth;
                    }
                }
            });

            renderTransactions(filteredTransactions);
            calculateSummary(filteredTransactions);
        }

        function renderTransactions(transactions) {
            const tbody = document.getElementById('transactions-list');
            tbody.innerHTML = '';

            if (transactions.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">Nenhum lançamento para este mês.</td></tr>`;
                return;
            }

            transactions.forEach(t => {
                const formattedValue = Number(t.amount).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                const typeLabel = t.type === 'income' ? '<span class="text-emerald-600 font-medium">Receita</span>' : '<span class="text-rose-600 font-medium">Despesa</span>';
                
                // Formatar data de YYYY-MM-DD para DD/MM/YYYY
                let dateDisplay = t.date;
                if (t.date && t.date.includes('-')) {
                    const parts = t.date.split('-');
                    if (parts.length === 3) {
                        dateDisplay = `${parts[2]}/${parts[1]}/${parts[0]}`;
                    }
                }

                if (t.type === 'income' && t.recurrence === 'eventual') {
                    dateDisplay = `Mês: ${t.target_month}`;
                } else if (t.type === 'income' && t.recurrence === 'recorrente') {
                    dateDisplay = 'Recorrente';
                }

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-3 text-slate-500">${dateDisplay}</td>
                        <td class="p-3 font-medium">${t.description}</td>
                        <td class="p-3 text-slate-600">${t.category || 'Geral'}</td>
                        <td class="p-3">${typeLabel}</td>
                        <td class="p-3 text-right font-semibold ${t.type === 'income' ? 'text-emerald-600' : 'text-slate-800'}">${formattedValue}</td>
                        <td class="p-3 text-center">
                            <button type="button" onclick="deleteTransaction('${t.id}')" class="text-slate-400 hover:text-rose-600 transition text-xs font-bold">Excluir</button>
                        </td>
                    </tr>
                `;
            });
        }

        function calculateSummary(transactions) {
            let income = 0;
            let expense = 0;

            transactions.forEach(t => {
                const val = Number(t.amount);
                if (t.type === 'income') income += val;
                else expense += val;
            });

            const balance = income - expense;

            document.getElementById('total-balance').innerText = balance.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            document.getElementById('total-income').innerText = income.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            document.getElementById('total-expense').innerText = expense.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        async function addTransaction(e) {
            e.preventDefault();
            let description = document.getElementById('desc').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const type = document.getElementById('type').value;
            const category = document.getElementById('category').value;
            const date = document.getElementById('txn-date').value; // Pega a data escolhida pelo usuário
            
            if (category === 'Outros') {
                const otherDetails = document.getElementById('other-details').value;
                if (otherDetails) {
                    description = `${description} (${otherDetails})`;
                }
            }

            const recurrence = type === 'income' ? document.getElementById('recurrence').value : 'eventual';
            const targetMonth = (type === 'income' && recurrence === 'eventual') ? document.getElementById('target-month').value : null;

            const { error } = await supabaseClient.from('transactions').insert([
                { description, amount, type, category, recurrence, target_month: targetMonth, date, user_id: currentUser.id }
            ]);

            if (error) {
                alert('Erro ao salvar: ' + error.message);
            } else {
                document.getElementById('transaction-form').reset();
                // Restaura a data de hoje e o mês do filtro após resetar o form
                document.getElementById('txn-date').value = new Date().toISOString().split('T')[0];
                document.getElementById('filter-month').value = targetMonth || document.getElementById('filter-month').value;
                updateFormFields();
                loadTransactions();
            }
        }

        async function deleteTransaction(id) {
            if (!confirm('Deseja realmente excluir este lançamento?')) return;

            const { error } = await supabaseClient.from('transactions').delete().eq('id', id);
            if (error) alert('Erro ao excluir: ' + error.message);
            else loadTransactions();
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(() => console.log('PWA registrado com sucesso!'))
                    .catch(err => console.log('Erro ao registrar PWA:', err));
            });
        }
    </script>
</body>
</html>
